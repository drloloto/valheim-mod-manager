name: Release

# Tag a commit on main as vX.Y.Z (matching apps/client/package.json, Cargo.toml and tauri.conf.json) to build the
# Windows installers, the updater manifest (latest.json) and a portable zip. The release is assembled as a
# draft and published in the last step, once every asset is attached, with the CHANGELOG.md section of
# that version as its body.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (content of the updater private key) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty string if the key has none).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers, updater manifest, portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - name: Check that the tag matches the app version
        shell: bash
        working-directory: apps/client
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ]
      # A release is built from a fully checked tree, never from a cache.
      - run: vp run --no-cache ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Valheim Mod Manager ${{ github.ref_name }}"
          releaseBody: "Assembling…"
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
      - name: Build the portable zip and the release notes
        working-directory: apps/client
        run: |
          node scripts/portable.mjs
          node scripts/release-notes.mjs
      - name: Attach the portable zip and publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Valheim Mod Manager ${{ github.ref_name }}"
          body_path: apps/client/dist/release-notes.md
          draft: false
          prerelease: false
          files: apps/client/dist/valheim-mod-manager-*-portable-win64.zip
