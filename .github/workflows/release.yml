name: Release

# Tag a commit on main as vX.Y.Z (matching package.json, Cargo.toml and tauri.conf.json) to build the
# Windows installers, the updater manifest (latest.json) and a portable zip, attached to a draft release.
# Publish the draft by hand after a smoke test.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (content of the updater private key) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty string if the key has none).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers, updater manifest, portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$conf" ] && [ "$tag" = "$cargo" ]
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Valheim Mod Manager ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Installers are unsigned; Windows SmartScreen will warn on first start. The portable zip needs no installation."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
      - name: Build the portable zip
        run: node scripts/portable.mjs
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/valheim-mod-manager-*-portable-win64.zip
