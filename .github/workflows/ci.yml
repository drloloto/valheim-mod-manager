name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The same gate as on a developer machine: `vp run ci` (format, lint, type checks, svelte-check, tests,
    # both web builds, the Rust core). Windows, because the client is a Windows app and Tauri builds there.
    name: vp run ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      # the companion's tests use bun:test
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      # Vite Task results: an unchanged package replays instead of running again
      - uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ github.sha }}
          restore-keys: vite-task-${{ runner.os }}-
      - run: vp run ci

  companion:
    # The companion runs in a Linux image: its tar scenarios only run on Linux, and the image must build.
    name: Companion on Linux (tests, image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - uses: oven-sh/setup-bun@v2
      - run: vp run --filter @vmm/companion test
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/companion/Dockerfile
          push: false
          tags: valheim-companion:ci
