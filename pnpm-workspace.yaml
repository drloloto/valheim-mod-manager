packages:
  - apps/client
  - apps/companion
  - apps/companion/ui
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true

# One version per shared dependency for every package ("catalog:" in package.json).
catalog:
  "@fontsource-variable/archivo": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@lucide/svelte": ^1.54.0
  "@sveltejs/adapter-static": ^4.0.0
  "@sveltejs/kit": ^3.0.0
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@tailwindcss/vite": ^4.3.3
  bits-ui: ^2.19.5
  clsx: ^2.1.1
  shadcn-svelte: ^1.7.0
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  svelte-sonner: ^1.2.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~6.0.2
  vite: ^8.3.4
  vitest: ^5.0.3
  prettier: ^3.9.9
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
