[package]
name = "valheim-mod-manager"
version = "0.4.0"
description = "Local mod manager for Valheim (r2modman alternative)"
license = "MIT"
repository = "https://github.com/drloloto/valheim-mod-manager"
edition = "2021"

[lib]
name = "valheim_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "stream", "http2", "json"] }
futures = "0.3"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.23"
sha2 = "0.11"
aes-gcm = "0.10"
hkdf = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
